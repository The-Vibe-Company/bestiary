# À chaque envoi, sur toutes les branches : lint, types, garde-fou des migrations,
# tests (dont les tests sur base, contre un Postgres jetable) et scan de secrets.
# Le résultat s'affiche à côté du commit sur GitHub.
name: Vérification

on:
  push:

jobs:
  verifier:
    name: Lint, types, migrations, tests et secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bestia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base jetable propre à ce passage, détruite avec lui.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bestia_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique, pour le scan de secrets
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run secrets:history
